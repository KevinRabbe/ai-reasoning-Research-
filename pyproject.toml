[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reasoning-research"
version = "0.1.0"
description = "POC-0 benchmark for machine-native reasoning protocols"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "KevinRabbe"}]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
